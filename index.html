<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Insignificant Digits</title>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500;700;900&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #fafbfd;
    --bg-listen: #f3f5f9;
    --ink: #141a2e;
    --ink-light: #5c6b85;
    --hairline: #e2e6ee;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- hero / animated vine banner ---------- */

  .hero{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    overflow: hidden;
    z-index: 0;
  }

  #vineCanvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Holds open a full viewport of empty (transparent) scroll space so the
     fixed background above is fully visible before the listen panel rises
     up to cover it. */
  .hero-spacer{
    height: 100vh;
    pointer-events: none;
  }

  .wordmark{
    position: absolute;
    right: clamp(20px, 4vw, 64px);
    bottom: clamp(24px, 6vh, 64px);
    z-index: 2;
    margin: 0;
    line-height: 0;
  }

  .wordmark img{
    display: block;
    width: clamp(220px, 30vw, 520px);
    height: auto;
  }

  /* On narrow screens the corner-anchored wordmark gets lost in the busier,
     more vertical layout, so it moves to a centered spot higher up instead. */
  @media (max-width: 700px){
    .wordmark{
      left: 50%;
      right: auto;
      /* clamp() plus the home-indicator safe-area inset, so it clears both
         the bottom of the screen and iOS's gesture bar. */
      bottom: calc(clamp(110px, 24vh, 220px) + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
    }

    .wordmark img{
      width: clamp(230px, 62vw, 380px);
    }
  }

  /* ---------- listen section ---------- */
  /* Rises up over the fixed vine background as the page scrolls, so the
     animation stays visible behind it like a permanent backdrop. */

  .listen{
    position: relative;
    z-index: 1;
    background: rgba(243, 245, 249, 0.94);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--hairline);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -18px 48px rgba(20, 26, 46, 0.12);
    padding: clamp(40px, 7vh, 88px) clamp(20px, 5vw, 64px) clamp(56px, 9vh, 104px);
  }

  .listen-inner{
    max-width: 720px;
    margin: 0 auto;
  }

  .listen-label{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin: 0 0 0.9rem;
  }

  .listen-title{
    font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: -0.005em;
    color: var(--ink);
    margin: 0 0 1.6rem;
    text-transform: lowercase;
  }

  .player-frame{
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(20, 26, 46, 0.06), 0 10px 30px rgba(20, 26, 46, 0.07);
    background: #fff;
  }

  .player-frame iframe{
    display: block;
    width: 100%;
    border: 0;
  }

  .player-credit{
    font-size: 11px;
    color: var(--ink-light) !important;
    line-break: anywhere;
    word-break: normal;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: Interstate, 'Lucida Grande', 'Lucida Sans Unicode', 'Lucida Sans', Garuda, Verdana, Tahoma, sans-serif;
    font-weight: 400;
    padding: 8px 2px 0;
  }

  .player-credit a{
    color: var(--ink-light);
    text-decoration: none;
  }

  .player-credit a:hover,
  .player-credit a:focus-visible{
    text-decoration: underline;
  }
</style>
</head>

  function easeOutBack(t){
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  function easeInQuad(t){ return t * t; }
  function easeOutQuad(t){ return 1 - (1 - t) * (1 - t); }

  // ---- hexagon geometry (a single rounded hex path, not a cluster of dots) ----
  var HEX_ANGLES = [-90, -30, 30, 90, 150, 210].map(function(d){ return d * Math.PI / 180; });

  function hexVertices(r){
    return HEX_ANGLES.map(function(a){ return { x: Math.cos(a) * r, y: Math.sin(a) * r }; });
  }

  function normalize(dx, dy){
    var len = Math.hypot(dx, dy) || 1;
    return { x: dx / len, y: dy / len };
  }

  function roundedPolygonPath(ctx2, points, radius){
    var n = points.length;
    for (var i = 0; i < n; i++){
      var curr = points[i];
      var next = points[(i + 1) % n];
      var prev = points[(i - 1 + n) % n];
      var toNext = normalize(next.x - curr.x, next.y - curr.y);
      var toPrev = normalize(prev.x - curr.x, prev.y - curr.y);
      var p1 = { x: curr.x + toPrev.x * radius, y: curr.y + toPrev.y * radius };
      var p2 = { x: curr.x + toNext.x * radius, y: curr.y + toNext.y * radius };
      if (i === 0){ ctx2.moveTo(p1.x, p1.y); } else { ctx2.lineTo(p1.x, p1.y); }
      ctx2.quadraticCurveTo(curr.x, curr.y, p2.x, p2.y);
    }
    ctx2.closePath();
  }

  function makeJitter(){
    return { dAlpha: rand(-0.06, 0.06), dColor: rand(-10, 10) };
  }

  // Ordered lifecycle a flower cycles through, forever, at its own pace:
  // hidden (dormant on the vine) -> bud (grows in from a point) -> hold (in bloom) ->
  // fall (drops, sways, tumbles, settles flat) -> land (rests on the ground) ->
  // fadeout (dissolves) -> hidden again
  var NEXT_PHASE = { hidden: 'bud', bud: 'hold', hold: 'fall', fall: 'land', land: 'fadeout', fadeout: 'hidden' };

  function enterPhase(slot, phase, now, groundY){
    slot.phase = phase;
    slot.phaseStart = now;
    switch (phase){
      case 'hidden':
        // For the first several seconds after the page loads, flowers bud in
        // much more rapidly; afterward the pace settles down to normal.
        if (now - ANIMATION_START < BURST_WINDOW_MS){
          slot.hiddenDuration = rand(60, 1100);
        } else {
          slot.hiddenDuration = rand(500, 3600);
        }
        break;
      case 'bud':
        slot.budDuration = rand(550, 950);
        slot.jitter = makeJitter();
        break;
      case 'hold':
        slot.holdDuration = rand(2600, 6000);
        break;
      case 'fall':
        slot.fallDuration = rand(2000, 3400);
        slot.fallFromX = slot.x;
        slot.fallFromY = slot.y;
        slot.fallToX = slot.x + rand(-30, 30);
        slot.fallToY = groundY - rand(0, slot.size * 1.3);
        slot.swayAmp = rand(10, 24);
        slot.swayFreq = rand(1.1, 2.3);
        slot.rotPeak = slot.baseRot + rand(-40, 40);
        slot.rotFlat = rand(-5, 5);
        break;
      case 'land':
        // Shapes rest on the ground for good once they land — this phase
        // never times out, so they never advance to 'fadeout'.
        slot.landDuration = Infinity;
        // Self-heal: usable whether we arrived here via a real fall, or were
        // seeded directly into 'land' at page-load for initial variety.
        if (typeof slot.fallToX !== 'number'){
          slot.fallToX = slot.x + rand(-24, 24);
          slot.fallToY = groundY - rand(0, slot.size * 1.3);
        }
        if (typeof slot.rotFlat !== 'number'){ slot.rotFlat = rand(-5, 5); }
        slot.restX = slot.fallToX;
        slot.restY = slot.fallToY;
        break;
      case 'fadeout':
        slot.fadeDuration = 900;
        if (typeof slot.restX !== 'number'){
          slot.restX = slot.x + rand(-24, 24);
          slot.restY = groundY - rand(0, slot.size * 1.3);
          slot.rotFlat = rand(-5, 5);
        }
        break;
    }
  }

  function phaseDuration(slot){
    switch (slot.phase){
      case 'hidden': return slot.hiddenDuration;
      case 'bud': return slot.budDuration;
      case 'hold': return slot.holdDuration;
      case 'fall': return slot.fallDuration;
      case 'land': return slot.landDuration;
      case 'fadeout': return slot.fadeDuration;
    }
    return 0;
  }

  // Advance a slot to its next phase. Falling is metered globally: only
  // MAX_FALLING flowers may be mid-air at once, so a bloom whose time is up
  // just keeps blooming a little longer until a falling "slot" frees up.
  function tryAdvance(slot, now, groundY){
    if (slot.phase === 'hold'){
      if (fallingCount < MAX_FALLING){
        fallingCount++;
        enterPhase(slot, 'fall', now, groundY);
      } else {
        slot.phaseStart = now;
        slot.holdDuration = rand(500, 1400);
      }
    } else if (slot.phase === 'fall'){
      fallingCount = Math.max(0, fallingCount - 1);
      enterPhase(slot, 'land', now, groundY);
    } else {
      enterPhase(slot, NEXT_PHASE[slot.phase], now, groundY);
    }
  }

  function updateSlot(slot, now, groundY){
    if (now - slot.phaseStart >= phaseDuration(slot)){
      tryAdvance(slot, now, groundY);
    }
  }

  // The page starts completely bare: every flower begins dormant, with
  // nothing on the vines and nothing resting on the ground. From there the
  // burst-aware 'hidden' duration above makes them bud in quickly at first,
  // then settle into their normal, calmer pace.
  function makeSlot(x, y, colorT, size, groundY){
    var slot = { x: x, y: y, colorT: colorT, size: size, baseRot: rand(-10, 10), jitter: makeJitter() };
    var now = performance.now();
    enterPhase(slot, 'hidden', now, groundY);
    return slot;
  }

  function makeColumn(x, groundY){
    // Vines hang from just above the top edge and reach only about halfway
    // down the page, with a ragged, varied bottom edge from column to column.
    var topY = rand(-40, 10);
    // Narrowed toward the denser end (higher minimum), while the sparsest
    // vines never get sparser than before (same upper bound).
    var bottomY = H * rand(0.46, 0.56);
    var vineLength = Math.max(40, bottomY - topY);
    // Rows have some air between them rather than tightly overlapping, so
    // patches of bare page show through the vine, like the reference image.
    var spacingFactor = rand(0.62, 0.76);
    var spacing = Math.max(7, HEX_SIZE * 2 * spacingFactor);
    var numRows = Math.max(6, Math.round(vineLength / spacing));
    // The vine is wide and busy near the top, and tapers down to a narrow,
    // sparse tip toward its lower end. Narrower on mobile so neighboring
    // vines (which sit closer together on a slim screen) stay visually
    // distinct instead of merging into a solid mass.
    var topSpread = isMobile ? rand(1.7, 2.1) : rand(2.9, 3.4);
    var tipSpread = isMobile ? rand(0.18, 0.3) : rand(0.22, 0.4);
    // About five shapes wide at the top, tapering to one or two at the tip
    // (fewer on mobile, to keep the total shape count in check).
    var maxShapesPerRow = isMobile ? randInt(3, 4) : randInt(5, 6);
    var tipShapesPerRow = isMobile ? 1 : randInt(1, 2);
    var slots = [];
    for (var s = 0; s < numRows; s++){
      var tpos = numRows === 1 ? 0 : s / (numRows - 1);
      var y = lerp(topY, bottomY, tpos) + rand(-3, 3);
      var spread = lerp(topSpread, tipSpread, tpos);
      var shapesInRow = Math.max(1, Math.round(lerp(maxShapesPerRow, tipShapesPerRow, tpos) + rand(-0.4, 0.4)));
      var halfWidth = HEX_SIZE * spread;
      // Target positions are evenly spaced across the row's width, but a
      // wide, uneven jitter is layered on top: some neighbors end up
      // overlapping, others leave a small visible gap, instead of a
      // perfectly uniform comb. The jitter scales with the row's own width,
      // so it stays proportionate as rows narrow toward the tip.
      var slotGap = shapesInRow > 1 ? (2 * halfWidth) / (shapesInRow - 1) : 0;
      var jitterRange = slotGap * 0.6 + halfWidth * 0.35 + HEX_SIZE * 0.35;
      for (var k = 0; k < shapesInRow; k++){
        // A lone shape in a row doesn't have to sit right on the centerline.
        var baseX = shapesInRow === 1 ? rand(-1, 1) * halfWidth * 0.6 : lerp(-halfWidth, halfWidth, k / (shapesInRow - 1));
        var xOff = baseX + rand(-1, 1) * jitterRange;
        var yOff = rand(-6, 6);
        // Color still varies shape-to-shape, and leans darker near the
        // vine's horizontal centerline and lighter toward its outer edges,
        // plus a gentle overall lightening further down the vine.
        var distFromCenter = halfWidth > 0 ? clamp01(Math.abs(baseX) / halfWidth) : 0;
        var colorExponent = lerp(4.8, 1.3, distFromCenter) - tpos * 0.9;
        colorExponent = Math.max(0.45, colorExponent);
        var colorT = Math.pow(Math.random(), colorExponent);
        slots.push(makeSlot(x + xOff, y + yOff, colorT, HEX_SIZE, groundY));
      }
    }
    return { x: x, slots: slots };
  }

  // A short, light-colored scattering of shapes in the gap between two
  // vines, confined to the top of the page. How far down it reaches depends
  // on how close the gap is to the horizontal center of the whole piece:
  // shortest at the center (~10% of a vine's depth), longest at the sides
  // (~25%), thinning out to nothing as it goes.
  function makeFillerColumn(gapX, groundY){
    var distFromCenterNorm = W > 0 ? clamp01(Math.abs(gapX - W / 2) / (W / 2)) : 0;
    var depthFraction = lerp(0.25, 0.50, distFromCenterNorm);
    var vineHeightRef = H * 0.48;
    var maxDepth = vineHeightRef * depthFraction;
    if (maxDepth < 16) return null;
    var topY = rand(-20, 6);
    var bottomY = topY + maxDepth;
    // Tighter row spacing and more shapes per row than before, packed into
    // the same depth range rather than reaching any further down.
    var spacing = HEX_SIZE * 2 * rand(0.5, 0.75);
    var numRows = Math.max(3, Math.round(maxDepth / spacing));
    var slots = [];
    for (var s = 0; s < numRows; s++){
      var tpos = numRows === 1 ? 0 : s / (numRows - 1);
      var y = lerp(topY, bottomY, tpos) + rand(-3, 3);
      var countHere = Math.round(lerp(4, 0, tpos) + rand(-0.4, 0.4));
      for (var k = 0; k < countHere; k++){
        var xOff = rand(-1, 1) * 22;
        var yOff = rand(-4, 4);
        // Lighter range only.
        var colorT = rand(0.55, 1.0);
        slots.push(makeSlot(gapX + xOff, y + yOff, colorT, HEX_SIZE, groundY));
      }
    }
    return slots.length ? { x: gapX, slots: slots } : null;
  }

  function buildColumns(){
    columns = [];
    fallingCount = 0;
    // Fewer, wider-spaced vines, each with more room to spread out. On
    // narrow/mobile screens the vines themselves are also narrower (see
    // makeColumn), so a smaller minimum count still leaves clear gaps
    // between them instead of merging into one dense mass.
    var colWidth = isMobile ? 130 : 145;
    var count = Math.max(isMobile ? 3 : 6, Math.round(W / colWidth));
    groundY = computeGroundY();
    for (var i = 0; i < count; i++){
      var x = (i + 0.5) * (W / count) + rand(-8, 8);
      columns.push(makeColumn(x, groundY));
    }
    // Filler shapes in the gaps between (and just outside) the vines. Skipped
    // on mobile, where the vines already sit close together and the extra
    // shapes just read as clutter rather than "in-between" texture.
    if (!isMobile){
      for (var g = 0; g <= count; g++){
        var gapX = g * (W / count);
        var filler = makeFillerColumn(gapX, groundY);
        if (filler){ columns.push(filler); }
      }
    }
  }

  function drawHexShape(x, y, r, colorT, alpha, scale, rot, jitter, squash){
    if (alpha <= 0.01 || scale <= 0.001) return;
    var rgb = colorAt(colorT);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot * Math.PI / 180);
    // squash < 1 flattens the hexagon vertically, so it reads as lying flat
    // on the ground rather than standing upright facing the viewer.
    ctx.scale(scale, scale * (typeof squash === 'number' ? squash : 1));
    ctx.beginPath();
    roundedPolygonPath(ctx, hexVertices(r), r * 0.24);
    ctx.fillStyle = 'rgba(' + clampByte(rgb[0] + jitter.dColor) + ',' + clampByte(rgb[1] + jitter.dColor) + ',' + clampByte(rgb[2] + jitter.dColor) + ',' + clamp01(alpha * (0.94 + jitter.dAlpha)) + ')';
    ctx.fill();
    ctx.restore();
  }

  function drawSlot(slot, now){
    var x, y, scale = 1, alpha = 1, rot = slot.baseRot, squash = 1;
    switch (slot.phase){
      case 'hidden':
        return;
      case 'bud': {
        // Budding is simply the hexagon expanding outward from a point.
        var t = Math.min(1, (now - slot.phaseStart) / slot.budDuration);
        scale = Math.max(0, easeOutBack(t));
        alpha = Math.min(1, t * 1.4);
        x = slot.x; y = slot.y;
        break;
      }
      case 'hold': {
        var bob = Math.sin((now + slot.x * 13) / 900) * 1.6;
        x = slot.x; y = slot.y + bob;
        break;
      }
      case 'fall': {
        var ft = (now - slot.phaseStart) / slot.fallDuration;
        var e = easeInQuad(ft);
        x = lerp(slot.fallFromX, slot.fallToX, ft) + Math.sin(ft * Math.PI * slot.swayFreq) * slot.swayAmp * (1 - ft);
        y = lerp(slot.fallFromY, slot.fallToY, e);
        scale = lerp(1, 0.9, e);
        // Tumbles a bit on the way down, then settles flat just before landing.
        if (ft < 0.72){
          rot = lerp(slot.baseRot, slot.rotPeak, ft / 0.72);
        } else {
          rot = lerp(slot.rotPeak, slot.rotFlat, (ft - 0.72) / 0.28);
        }
        break;
      }
      case 'land': {
        x = slot.restX; y = slot.restY; rot = slot.rotFlat; scale = 0.9; alpha = 0.85;
        // Settles flat over a brief moment right after touching down, like
        // it's laying itself down on the ground.
        var settleT = Math.min(1, (now - slot.phaseStart) / 150);
        squash = lerp(1, 0.42, easeOutQuad(settleT));
        break;
      }
      case 'fadeout': {
        var xt = (now - slot.phaseStart) / slot.fadeDuration;
        x = slot.restX; y = slot.restY; rot = slot.rotFlat;
        scale = 0.9 * (1 - 0.08 * xt); alpha = 0.85 * (1 - xt);
        squash = 0.42;
        break;
      }
    }
    drawHexShape(x, y, slot.size, slot.colorT, alpha, scale, rot, slot.jitter, squash);
  }

  function frame(now){
    ctx.clearRect(0, 0, W, H);
    for (var c = 0; c < columns.length; c++){
      var slots = columns[c].slots;
      for (var s = 0; s < slots.length; s++){
        updateSlot(slots[s], now, groundY);
        drawSlot(slots[s], now);
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  function setupCanvas(){
    var rect = heroEl.getBoundingClientRect();
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    isMobile = W < 700;
    HEX_SIZE = isMobile ? 11 : 13;
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Only rebuild the vine layout (which resets every flower to dormant)
    // on a real size change, not on the small height wobble mobile browser
    // chrome causes while scrolling.
    var widthChanged = Math.abs(W - builtW) > 2;
    var heightChanged = Math.abs(H - builtH) > 120;
    if (columns.length === 0 || widthChanged || heightChanged){
      buildColumns();
      builtW = W;
      builtH = H;
    }
  }

  function renderStatic(){
    var now = performance.now();
    for (var c = 0; c < columns.length; c++){
      var slots = columns[c].slots;
      for (var s = 0; s < slots.length; s++){
        var slot = slots[s];
        slot.phase = 'hold';
        slot.phaseStart = now - 100000;
        slot.holdDuration = Number.MAX_SAFE_INTEGER;
      }
    }
    ctx.clearRect(0, 0, W, H);
    for (var c2 = 0; c2 < columns.length; c2++){
      var slots2 = columns[c2].slots;
      for (var s2 = 0; s2 < slots2.length; s2++){
        drawSlot(slots2[s2], now);
      }
    }
  }

  function init(){
    setupCanvas();
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    if (reducedMotion){
      renderStatic();
    } else {
      rafId = requestAnimationFrame(frame);
    }
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 200);
  });

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(init).catch(init);
  } else {
    init();
  }
  window.addEventListener('load', function(){
    // re-init once after full load in case webfonts shifted layout metrics
    setTimeout(init, 60);
  });
})();
</script>

</body>
</html>
