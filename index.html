<!doctype html>
<html lang="en">
<head>
<title>Insignificant Digits</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500;700;900&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #fafbfd;
    --bg-listen: #f3f5f9;
    --ink: #141a2e;
    --ink-light: #5c6b85;
    --hairline: #e2e6ee;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- hero / animated vine banner ---------- */

  .hero{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    overflow: hidden;
    z-index: 0;
  }

  #vineCanvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Holds open most of a viewport of empty (transparent) scroll space so
     the fixed background above reads clearly first -- but a little short of
     the full 100vh, so the listen card's rounded top edge peeks up into
     view from the start as a hint that there's more to scroll to. */
  .hero-spacer{
    height: calc(100vh - clamp(36px, 8vh, 84px));
    pointer-events: none;
  }

  .wordmark{
    margin: 0 0 clamp(28px, 4vh, 40px);
    line-height: 0;
    text-align: center;
  }

  .wordmark img{
    display: inline-block;
    width: clamp(280px, 46vw, 640px);
    height: auto;
  }

  @media (max-width: 700px){
    .wordmark img{
      width: clamp(260px, 78vw, 440px);
    }
  }

  /* ---------- listen section ---------- */
  /* A floating card that rises up over the fixed vine background as the
     page scrolls, with margin on every side so the animation stays
     visible around it instead of being completely covered. */

  .listen{
    position: relative;
    z-index: 2;
    margin: 0 clamp(12px, 4vw, 48px) clamp(28px, 7vh, 72px);
    background: rgba(243, 245, 249, 0.92);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(20, 26, 46, 0.16);
    padding: clamp(40px, 7vh, 88px) clamp(20px, 5vw, 64px);
  }

  .listen-inner{
    max-width: 720px;
    margin: 0 auto;
  }

  .listen-label{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin: 0 0 0.9rem;
  }

  .listen-title{
    font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: -0.005em;
    color: var(--ink);
    margin: 0 0 1.6rem;
    text-transform: lowercase;
  }

  .tracks{
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 5vh, 48px);
  }

  .player-frame{
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(20, 26, 46, 0.06), 0 10px 30px rgba(20, 26, 46, 0.07);
    background: #fff;
  }

  .player-frame iframe{
    display: block;
    width: 100%;
    border: 0;
  }

  .player-credit{
    font-size: 11px;
    color: var(--ink-light) !important;
    line-break: anywhere;
    word-break: normal;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: Interstate, 'Lucida Grande', 'Lucida Sans Unicode', 'Lucida Sans', Garuda, Verdana, Tahoma, sans-serif;
    font-weight: 400;
    padding: 8px 2px 0;
  }

  .player-credit a{
    color: var(--ink-light);
    text-decoration: none;
  }

  .player-credit a:hover,
  .player-credit a:focus-visible{
    text-decoration: underline;
  }

  .track-links{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 10px 2px 0;
  }

  .track-links-label{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-right: 2px;
  }

  .track-link-icon{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--brand, var(--ink-light));
    color: #fff;
    box-shadow: 0 1px 2px rgba(20, 26, 46, 0.12);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .track-link-icon svg{
    width: 15px;
    height: 15px;
    fill: currentColor;
    display: block;
  }

  .track-link-icon:hover,
  .track-link-icon:focus-visible{
    transform: translateY(-1px) scale(1.07);
    box-shadow: 0 4px 12px rgba(20, 26, 46, 0.2);
  }

  .site-footer{
    margin: clamp(32px, 6vh, 56px) 0 0;
    text-align: center;
  }

  .site-footer a{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-light);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .site-footer a:hover,
  .site-footer a:focus-visible{
    color: var(--ink);
    border-bottom-color: var(--ink-light);
  }
</style>
</head>
<body>
<main>
  <div class="hero" id="hero">
    <canvas id="vineCanvas" aria-hidden="true"></canvas>
  </div>

  <div class="hero-spacer" aria-hidden="true"></div>

  <section class="listen" aria-labelledby="listen-heading">
    <div class="listen-inner">
      <h1 class="wordmark"><img src="insignificant-digits.png" alt="insignificant digits" /></h1>
      <p class="listen-label">Now streaming</p>
      <h2 class="listen-title" id="listen-heading">latest track</h2>
      <div class="tracks" id="tracks"></div>

      <p class="site-footer"><a href="about.html">about</a></p>
    </div>
  </section>
</main>

<script>
(function(){
  "use strict";

  // ---- SoundCloud tracks ----
  // To add another track, add one entry below with its `permalink` (the
  // track's normal soundcloud.com page -- copy it straight from the
  // browser's address bar) and a `title`. Every entry renders as its own
  // player automatically, in order -- no other markup needs to change.
  //
  // (The last entry also carries `embedUrl`, a SoundCloud-resolved form
  // of the same track kept from the original embed code. That field is
  // optional -- for a new track, `permalink` alone is enough.)
  //
  // To add streaming links (Apple Music, Spotify, YouTube Music) below a
  // track's player, add a `links` object with any of `appleMusic`,
  // `spotify`, `youtubeMusic` -- only the ones present are shown, in that
  // order. Omit `links` entirely for a track with no streaming links yet.
  var TRACKS = [
    {
      title: 'Sunny Side',
      permalink: 'https://soundcloud.com/insignificant-digits/sunny-side',
      links: {
        appleMusic: 'https://music.apple.com/ca/album/sunny-side/6820128998?i=6820129008',
        spotify: 'https://open.spotify.com/track/7owvqM8sZMrV9fNGR9nhHL?si=83ef9abcbabc4f85',
        youtubeMusic: 'https://music.youtube.com/watch?v=hzZL4ScVUx8&si=aq_wBKVy9ksOmUja'
      }
    },
    {
      title: 'Nine Volt',
      permalink: 'https://soundcloud.com/insignificant-digits/nine-volt'
    },
    {
      title: 'Introvert',
      permalink: 'https://soundcloud.com/insignificant-digits/introvert'
    },
    {
      title: 'something blew',
      permalink: 'https://soundcloud.com/insignificant-digits/something-blew',
      embedUrl: 'https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A2351493410'
    }
    // {
    //   title: 'another track',
    //   permalink: 'https://soundcloud.com/insignificant-digits/another-track'
    // }
  ];

  function escapeHtml(s){
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Official brand glyphs (path data) and brand colors, so each streaming
  // link renders as that service's own recognizable icon rather than a
  // plain text link. Source: the Simple Icons project (simpleicons.org),
  // which tracks each company's current official logo mark.
  var STREAM_LINK_ORDER = [
    {
      key: 'appleMusic',
      label: 'Apple Music',
      color: '#FA243C',
      icon: '<path d="M23.994 6.124a9.23 9.23 0 00-.24-2.19c-.317-1.31-1.062-2.31-2.18-3.043a5.022 5.022 0 00-1.877-.726 10.496 10.496 0 00-1.564-.15c-.04-.003-.083-.01-.124-.013H5.986c-.152.01-.303.017-.455.026-.747.043-1.49.123-2.193.4-1.336.53-2.3 1.452-2.865 2.78-.192.448-.292.925-.363 1.408-.056.392-.088.785-.1 1.18 0 .032-.007.062-.01.093v12.223c.01.14.017.283.027.424.05.815.154 1.624.497 2.373.65 1.42 1.738 2.353 3.234 2.801.42.127.856.187 1.293.228.555.053 1.11.06 1.667.06h11.03a12.5 12.5 0 001.57-.1c.822-.106 1.596-.35 2.295-.81a5.046 5.046 0 001.88-2.207c.186-.42.293-.87.37-1.324.113-.675.138-1.358.137-2.04-.002-3.8 0-7.595-.003-11.393zm-6.423 3.99v5.712c0 .417-.058.827-.244 1.206-.29.59-.76.962-1.388 1.14-.35.1-.706.157-1.07.173-.95.045-1.773-.6-1.943-1.536a1.88 1.88 0 011.038-2.022c.323-.16.67-.25 1.018-.324.378-.082.758-.153 1.134-.24.274-.063.457-.23.51-.516a.904.904 0 00.02-.193c0-1.815 0-3.63-.002-5.443a.725.725 0 00-.026-.185c-.04-.15-.15-.243-.304-.234-.16.01-.318.035-.475.066-.76.15-1.52.303-2.28.456l-2.325.47-1.374.278c-.016.003-.032.01-.048.013-.277.077-.377.203-.39.49-.002.042 0 .086 0 .13-.002 2.602 0 5.204-.003 7.805 0 .42-.047.836-.215 1.227-.278.64-.77 1.04-1.434 1.233-.35.1-.71.16-1.075.172-.96.036-1.755-.6-1.92-1.544-.14-.812.23-1.685 1.154-2.075.357-.15.73-.232 1.108-.31.287-.06.575-.116.86-.177.383-.083.583-.323.6-.714v-.15c0-2.96 0-5.922.002-8.882 0-.123.013-.25.042-.37.07-.285.273-.448.546-.518.255-.066.515-.112.774-.165.733-.15 1.466-.296 2.2-.444l2.27-.46c.67-.134 1.34-.27 2.01-.403.22-.043.442-.088.663-.106.31-.025.523.17.554.482.008.073.012.148.012.223.002 1.91.002 3.822 0 5.732z"/>'
    },
    {
      key: 'spotify',
      label: 'Spotify',
      color: '#1ED760',
      icon: '<path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>'
    },
    {
      key: 'youtubeMusic',
      label: 'YouTube Music',
      color: '#FF0000',
      icon: '<path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/>'
    }
  ];

  function renderTrackLinks(links){
    if (!links) return '';
    var parts = [];
    for (var i = 0; i < STREAM_LINK_ORDER.length; i++){
      var def = STREAM_LINK_ORDER[i];
      var url = links[def.key];
      if (url){
        parts.push(
          '<a class="track-link-icon" style="--brand:' + def.color + '" href="' + escapeHtml(url) + '" target="_blank" rel="noopener" aria-label="Listen on ' + def.label + '" title="' + def.label + '">' +
            '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">' + def.icon + '</svg>' +
          '</a>'
        );
      }
    }
    if (!parts.length) return '';
    return '<div class="track-links"><span class="track-links-label">Stream</span>' + parts.join('') + '</div>';
  }

  function renderTracks(){
    var container = document.getElementById('tracks');
    if (!container) return;
    var headingEl = document.getElementById('listen-heading');
    if (headingEl){ headingEl.textContent = TRACKS.length > 1 ? 'tracks' : 'latest track'; }
    var html = '';
    for (var i = 0; i < TRACKS.length; i++){
      var track = TRACKS[i];
      var safeTitle = escapeHtml(track.title);
      var safePermalink = escapeHtml(track.permalink);
      var embedSrc = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(track.embedUrl || track.permalink) +
        '&color=%23141a2e&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true';
      html += '<div class="track">' +
          '<div class="player-frame">' +
            '<iframe title="Insignificant Digits - ' + safeTitle + ', SoundCloud player" width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="' + embedSrc + '"></iframe>' +
          '</div>' +
          '<div class="player-credit">' +
            '<a href="https://soundcloud.com/insignificant-digits" title="insignificant digits" target="_blank" rel="noopener">insignificant digits</a> &middot; ' +
            '<a href="' + safePermalink + '" title="' + safeTitle + '" target="_blank" rel="noopener">' + safeTitle + '</a>' +
          '</div>' +
          renderTrackLinks(track.links) +
        '</div>';
    }
    container.innerHTML = html;
  }

  renderTracks();
})();
</script>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById('vineCanvas');
  var ctx = canvas.getContext('2d');
  var heroEl = document.getElementById('hero');
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1;
  var isMobile = false;
  var columns = [];
  var rafId = null;

  // The width/height the current set of columns was actually built for.
  // Mobile browsers fire 'resize' constantly as the address bar shows and
  // hides while scrolling, even though the page hasn't really changed size —
  // rebuilding the whole vine on every one of those would make the
  // animation look like it keeps restarting. So layout is only rebuilt when
  // the size has changed by a meaningful amount (a real resize or rotation),
  // not for that address-bar jitter.
  var builtW = 0, builtH = 0;

  // How many flowers may be mid-fall at once, across the whole page.
  var MAX_FALLING = 2;
  var fallingCount = 0;

  // The page starts completely bare, then blooms in quickly for the first
  // several seconds before settling into its normal, calmer pace.
  var ANIMATION_START = performance.now();
  var BURST_WINDOW_MS = 7000;

  // Every hexagon is drawn at this same fixed size (a touch smaller on
  // narrow/mobile screens, set in setupCanvas).
  var HEX_SIZE = 13;

  // navy (top of vine) -> pale sky (bottom of vine)
  var PALETTE = ['#141d33', '#2c3f6b', '#4a68a3', '#7f9dcb', '#b8cbe8', '#e4ecf6'];

  function rand(min, max){ return min + Math.random() * (max - min); }
  function randInt(min, max){ return Math.floor(rand(min, max + 1)); }
  function lerp(a, b, t){ return a + (b - a) * t; }
  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function clampByte(v){ v = Math.round(v); return v < 0 ? 0 : (v > 255 ? 255 : v); }

  function hexToRgb(hex){
    var n = parseInt(hex.replace('#', ''), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  var PALETTE_RGB = PALETTE.map(hexToRgb);

  function colorAt(t){
    t = clamp01(t);
    var segF = t * (PALETTE_RGB.length - 1);
    var i = Math.min(PALETTE_RGB.length - 2, Math.floor(segF));
    var lt = segF - i;
    var c1 = PALETTE_RGB[i], c2 = PALETTE_RGB[i + 1];
    return [lerp(c1[0], c2[0], lt), lerp(c1[1], c2[1], lt), lerp(c1[2], c2[2], lt)];
  }

  function easeOutBack(t){
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  function easeInQuad(t){ return t * t; }
  function easeOutQuad(t){ return 1 - (1 - t) * (1 - t); }

  // ---- hexagon geometry (a single rounded hex path, not a cluster of dots) ----
  var HEX_ANGLES = [-90, -30, 30, 90, 150, 210].map(function(d){ return d * Math.PI / 180; });

  function hexVertices(r){
    return HEX_ANGLES.map(function(a){ return { x: Math.cos(a) * r, y: Math.sin(a) * r }; });
  }

  function normalize(dx, dy){
    var len = Math.hypot(dx, dy) || 1;
    return { x: dx / len, y: dy / len };
  }

  function roundedPolygonPath(ctx2, points, radius){
    var n = points.length;
    for (var i = 0; i < n; i++){
      var curr = points[i];
      var next = points[(i + 1) % n];
      var prev = points[(i - 1 + n) % n];
      var toNext = normalize(next.x - curr.x, next.y - curr.y);
      var toPrev = normalize(prev.x - curr.x, prev.y - curr.y);
      var p1 = { x: curr.x + toPrev.x * radius, y: curr.y + toPrev.y * radius };
      var p2 = { x: curr.x + toNext.x * radius, y: curr.y + toNext.y * radius };
      if (i === 0){ ctx2.moveTo(p1.x, p1.y); } else { ctx2.lineTo(p1.x, p1.y); }
      ctx2.quadraticCurveTo(curr.x, curr.y, p2.x, p2.y);
    }
    ctx2.closePath();
  }

  function makeJitter(){
    return { dAlpha: rand(-0.06, 0.06), dColor: rand(-10, 10) };
  }

  // Ordered lifecycle a flower cycles through, forever, at its own pace:
  // hidden (dormant on the vine) -> bud (grows in from a point) -> hold (in
  // bloom) -> fall (drops, sways and tumbles all the way off the bottom
  // edge of the page, fading as it goes) -> hidden again. Nothing ever
  // settles or piles up; a fallen flower is simply gone, and that vine slot
  // waits its own random interval before budding again.
  var NEXT_PHASE = { hidden: 'bud', bud: 'hold', hold: 'fall', fall: 'hidden' };

  function enterPhase(slot, phase, now){
    slot.phase = phase;
    slot.phaseStart = now;
    switch (phase){
      case 'hidden':
        // For the first several seconds after the page loads, flowers bud in
        // much more rapidly; afterward the pace settles down to normal.
        if (now - ANIMATION_START < BURST_WINDOW_MS){
          slot.hiddenDuration = rand(60, 1100);
        } else {
          slot.hiddenDuration = rand(500, 3600);
        }
        break;
      case 'bud':
        slot.budDuration = rand(550, 950);
        slot.jitter = makeJitter();
        break;
      case 'hold':
        slot.holdDuration = rand(2600, 6000);
        break;
      case 'fall':
        // Slower than a straight drop -- this is a float/drift, not a fall
        // under gravity -- so there's time for the sway and bob below to
        // actually read as floating rather than a quick blur downward.
        slot.fallDuration = rand(3200, 4800);
        slot.fallFromX = slot.x;
        slot.fallFromY = slot.y;
        slot.fallToX = slot.x + rand(-50, 60);
        // Comfortably past the bottom edge of the canvas, so it has fully
        // left the page (not just out of view) before the phase ends.
        slot.fallToY = H + slot.size * 3 + rand(0, 60);
        // Side-to-side sway (like a leaf catching air) -- unlike a damped
        // wobble that straightens out, this keeps going at full amplitude
        // the whole way down, so the drift is still visibly swaying right
        // up until it disappears off the bottom edge.
        slot.swayAmp = rand(24, 48);
        slot.swayFreq = rand(1.6, 2.8);
        slot.swayPhase = rand(0, Math.PI * 2);
        // A smaller, faster vertical flutter layered on top of the sway,
        // so the path isn't a clean sine curve but a more erratic drift.
        slot.bobAmp = rand(7, 15);
        slot.bobFreq = rand(3.2, 5.4);
        slot.bobPhase = rand(0, Math.PI * 2);
        // Rotation wobbles in sync with the sway (tilting into the
        // direction it's drifting), on top of a slow overall tumble.
        slot.rotPeak = slot.baseRot + rand(-70, 70);
        slot.rotWobbleAmp = rand(14, 32);
        break;
    }
  }

  function phaseDuration(slot){
    switch (slot.phase){
      case 'hidden': return slot.hiddenDuration;
      case 'bud': return slot.budDuration;
      case 'hold': return slot.holdDuration;
      case 'fall': return slot.fallDuration;
    }
    return 0;
  }

  // Advance a slot to its next phase. Falling is metered globally: only
  // MAX_FALLING flowers may be mid-air at once, so a bloom whose time is up
  // just keeps blooming a little longer until a falling "slot" frees up.
  function tryAdvance(slot, now){
    if (slot.phase === 'hold'){
      if (fallingCount < MAX_FALLING){
        fallingCount++;
        enterPhase(slot, 'fall', now);
      } else {
        slot.phaseStart = now;
        slot.holdDuration = rand(500, 1400);
      }
    } else if (slot.phase === 'fall'){
      fallingCount = Math.max(0, fallingCount - 1);
      enterPhase(slot, 'hidden', now);
    } else {
      enterPhase(slot, NEXT_PHASE[slot.phase], now);
    }
  }

  function updateSlot(slot, now){
    if (now - slot.phaseStart >= phaseDuration(slot)){
      tryAdvance(slot, now);
    }
  }

  // The page starts completely bare: every flower begins dormant, with
  // nothing on the vines yet. From there the burst-aware 'hidden' duration
  // above makes them bud in quickly at first, then settle into their
  // normal, calmer pace.
  function makeSlot(x, y, colorT, size){
    var slot = { x: x, y: y, colorT: colorT, size: size, baseRot: rand(-10, 10), jitter: makeJitter() };
    var now = performance.now();
    enterPhase(slot, 'hidden', now);
    return slot;
  }

  function makeColumn(x){
    // Vines hang from just above the top edge and reach only about halfway
    // down the page, with a ragged, varied bottom edge from column to column.
    var topY = rand(-40, 10);
    // Narrowed toward the denser end (higher minimum), while the sparsest
    // vines never get sparser than before (same upper bound).
    var bottomY = H * rand(0.46, 0.56);
    var vineLength = Math.max(40, bottomY - topY);
    // Rows have some air between them rather than tightly overlapping, so
    // patches of bare page show through the vine, like the reference image.
    var spacingFactor = rand(0.62, 0.76);
    var spacing = Math.max(7, HEX_SIZE * 2 * spacingFactor);
    var numRows = Math.max(6, Math.round(vineLength / spacing));
    // The vine is wide and busy near the top, and tapers down to a narrow,
    // sparse tip toward its lower end. Narrower on mobile so neighboring
    // vines (which sit closer together on a slim screen) stay visually
    // distinct instead of merging into a solid mass.
    var topSpread = isMobile ? rand(1.7, 2.1) : rand(2.9, 3.4);
    var tipSpread = isMobile ? rand(0.18, 0.3) : rand(0.22, 0.4);
    // About five shapes wide at the top, tapering to one or two at the tip
    // (fewer on mobile, to keep the total shape count in check).
    var maxShapesPerRow = isMobile ? randInt(3, 4) : randInt(5, 6);
    var tipShapesPerRow = isMobile ? 1 : randInt(1, 2);
    var slots = [];
    for (var s = 0; s < numRows; s++){
      var tpos = numRows === 1 ? 0 : s / (numRows - 1);
      var y = lerp(topY, bottomY, tpos) + rand(-3, 3);
      var spread = lerp(topSpread, tipSpread, tpos);
      var shapesInRow = Math.max(1, Math.round(lerp(maxShapesPerRow, tipShapesPerRow, tpos) + rand(-0.4, 0.4)));
      var halfWidth = HEX_SIZE * spread;
      // Target positions are evenly spaced across the row's width, but a
      // wide, uneven jitter is layered on top: some neighbors end up
      // overlapping, others leave a small visible gap, instead of a
      // perfectly uniform comb. The jitter scales with the row's own width,
      // so it stays proportionate as rows narrow toward the tip.
      var slotGap = shapesInRow > 1 ? (2 * halfWidth) / (shapesInRow - 1) : 0;
      var jitterRange = slotGap * 0.6 + halfWidth * 0.35 + HEX_SIZE * 0.35;
      for (var k = 0; k < shapesInRow; k++){
        // A lone shape in a row doesn't have to sit right on the centerline.
        var baseX = shapesInRow === 1 ? rand(-1, 1) * halfWidth * 0.6 : lerp(-halfWidth, halfWidth, k / (shapesInRow - 1));
        var xOff = baseX + rand(-1, 1) * jitterRange;
        var yOff = rand(-6, 6);
        // Color still varies shape-to-shape, and leans darker near the
        // vine's horizontal centerline and lighter toward its outer edges,
        // plus a gentle overall lightening further down the vine.
        var distFromCenter = halfWidth > 0 ? clamp01(Math.abs(baseX) / halfWidth) : 0;
        var colorExponent = lerp(4.8, 1.3, distFromCenter) - tpos * 0.9;
        colorExponent = Math.max(0.45, colorExponent);
        var colorT = Math.pow(Math.random(), colorExponent);
        slots.push(makeSlot(x + xOff, y + yOff, colorT, HEX_SIZE));
      }
    }
    return { x: x, slots: slots };
  }

  // A short, light-colored scattering of shapes in the gap between two
  // vines, confined to the top of the page. How far down it reaches depends
  // on how close the gap is to the horizontal center of the whole piece:
  // shortest at the center (~10% of a vine's depth), longest at the sides
  // (~25%), thinning out to nothing as it goes.
  function makeFillerColumn(gapX){
    var distFromCenterNorm = W > 0 ? clamp01(Math.abs(gapX - W / 2) / (W / 2)) : 0;
    var depthFraction = lerp(0.25, 0.50, distFromCenterNorm);
    var vineHeightRef = H * 0.48;
    var maxDepth = vineHeightRef * depthFraction;
    if (maxDepth < 16) return null;
    var topY = rand(-20, 6);
    var bottomY = topY + maxDepth;
    // Tighter row spacing and more shapes per row than before, packed into
    // the same depth range rather than reaching any further down.
    var spacing = HEX_SIZE * 2 * rand(0.5, 0.75);
    var numRows = Math.max(3, Math.round(maxDepth / spacing));
    var slots = [];
    for (var s = 0; s < numRows; s++){
      var tpos = numRows === 1 ? 0 : s / (numRows - 1);
      var y = lerp(topY, bottomY, tpos) + rand(-3, 3);
      var countHere = Math.round(lerp(4, 0, tpos) + rand(-0.4, 0.4));
      for (var k = 0; k < countHere; k++){
        var xOff = rand(-1, 1) * 22;
        var yOff = rand(-4, 4);
        // Lighter range only.
        var colorT = rand(0.55, 1.0);
        slots.push(makeSlot(gapX + xOff, y + yOff, colorT, HEX_SIZE));
      }
    }
    return slots.length ? { x: gapX, slots: slots } : null;
  }

  function buildColumns(){
    columns = [];
    fallingCount = 0;
    // Fewer, wider-spaced vines, each with more room to spread out. On
    // narrow/mobile screens the vines themselves are also narrower (see
    // makeColumn), so a smaller minimum count still leaves clear gaps
    // between them instead of merging into one dense mass.
    var colWidth = isMobile ? 130 : 145;
    var count = Math.max(isMobile ? 3 : 6, Math.round(W / colWidth));
    for (var i = 0; i < count; i++){
      var x = (i + 0.5) * (W / count) + rand(-8, 8);
      columns.push(makeColumn(x));
    }
    // Filler shapes in the gaps between (and just outside) the vines. Skipped
    // on mobile, where the vines already sit close together and the extra
    // shapes just read as clutter rather than "in-between" texture.
    if (!isMobile){
      for (var g = 0; g <= count; g++){
        var gapX = g * (W / count);
        var filler = makeFillerColumn(gapX);
        if (filler){ columns.push(filler); }
      }
    }
  }

  function drawHexShape(x, y, r, colorT, alpha, scale, rot, jitter, squash){
    if (alpha <= 0.01 || scale <= 0.001) return;
    var rgb = colorAt(colorT);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot * Math.PI / 180);
    // squash < 1 flattens the hexagon vertically, so it reads as lying flat
    // on the ground rather than standing upright facing the viewer.
    ctx.scale(scale, scale * (typeof squash === 'number' ? squash : 1));
    ctx.beginPath();
    roundedPolygonPath(ctx, hexVertices(r), r * 0.24);
    ctx.fillStyle = 'rgba(' + clampByte(rgb[0] + jitter.dColor) + ',' + clampByte(rgb[1] + jitter.dColor) + ',' + clampByte(rgb[2] + jitter.dColor) + ',' + clamp01(alpha * (0.94 + jitter.dAlpha)) + ')';
    ctx.fill();
    ctx.restore();
  }

  function drawSlot(slot, now){
    var x, y, scale = 1, alpha = 1, rot = slot.baseRot, squash = 1;
    switch (slot.phase){
      case 'hidden':
        return;
      case 'bud': {
        // Budding is simply the hexagon expanding outward from a point.
        var t = Math.min(1, (now - slot.phaseStart) / slot.budDuration);
        scale = Math.max(0, easeOutBack(t));
        alpha = Math.min(1, t * 1.4);
        x = slot.x; y = slot.y;
        break;
      }
      case 'hold': {
        var bob = Math.sin((now + slot.x * 13) / 900) * 1.6;
        x = slot.x; y = slot.y + bob;
        break;
      }
      case 'fall': {
        var ft = (now - slot.phaseStart) / slot.fallDuration;
        // Eases in gently from the hold phase's own small bob, so sway and
        // flutter ramp up smoothly instead of snapping to full amplitude
        // the instant it starts falling.
        var wobbleEnv = Math.min(1, ft / 0.12);
        var sway = Math.sin(ft * Math.PI * slot.swayFreq + slot.swayPhase) * slot.swayAmp * wobbleEnv;
        var bob = Math.sin(ft * Math.PI * slot.bobFreq + slot.bobPhase) * slot.bobAmp * wobbleEnv;
        // A fairly even downward drift -- gravity's quadratic pickup would
        // read as a drop, not a float -- with the sway and bob layered on
        // top so the path curves and flutters rather than running straight.
        x = lerp(slot.fallFromX, slot.fallToX, ft) + sway;
        y = lerp(slot.fallFromY, slot.fallToY, ft) + bob;
        scale = lerp(1, 0.9, ft);
        // Tumbles the whole way down, with a wobble synced to the sway so
        // it tilts into the direction it's drifting, like a leaf catching
        // air -- there's no ground to settle flat against anymore, so it
        // just keeps turning and swaying until it's gone.
        rot = lerp(slot.baseRot, slot.rotPeak, ft) +
          Math.sin(ft * Math.PI * slot.swayFreq + slot.swayPhase + Math.PI / 2) * slot.rotWobbleAmp * wobbleEnv;
        // A gentle fade over the back half of the fall, so it dissolves
        // away rather than hard-cutting the instant it crosses the bottom
        // edge of the canvas.
        alpha = 1 - 0.7 * clamp01((ft - 0.55) / 0.45);
        break;
      }
    }
    drawHexShape(x, y, slot.size, slot.colorT, alpha, scale, rot, slot.jitter, squash);
  }

  function frame(now){
    ctx.clearRect(0, 0, W, H);
    for (var c = 0; c < columns.length; c++){
      var slots = columns[c].slots;
      for (var s = 0; s < slots.length; s++){
        updateSlot(slots[s], now);
        drawSlot(slots[s], now);
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  function setupCanvas(){
    var rect = heroEl.getBoundingClientRect();
    W = Math.max(1, Math.floor(rect.width));
    H = Math.max(1, Math.floor(rect.height));
    isMobile = W < 700;
    HEX_SIZE = isMobile ? 11 : 13;
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Only rebuild the vine layout (which resets every flower to dormant)
    // on a real size change, not on the small height wobble mobile browser
    // chrome causes while scrolling.
    var widthChanged = Math.abs(W - builtW) > 2;
    var heightChanged = Math.abs(H - builtH) > 120;
    if (columns.length === 0 || widthChanged || heightChanged){
      buildColumns();
      builtW = W;
      builtH = H;
    }
  }

  function renderStatic(){
    var now = performance.now();
    for (var c = 0; c < columns.length; c++){
      var slots = columns[c].slots;
      for (var s = 0; s < slots.length; s++){
        var slot = slots[s];
        slot.phase = 'hold';
        slot.phaseStart = now - 100000;
        slot.holdDuration = Number.MAX_SAFE_INTEGER;
      }
    }
    ctx.clearRect(0, 0, W, H);
    for (var c2 = 0; c2 < columns.length; c2++){
      var slots2 = columns[c2].slots;
      for (var s2 = 0; s2 < slots2.length; s2++){
        drawSlot(slots2[s2], now);
      }
    }
  }

  function init(){
    setupCanvas();
    if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    if (reducedMotion){
      renderStatic();
    } else {
      rafId = requestAnimationFrame(frame);
    }
  }

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 200);
  });

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(init).catch(init);
  } else {
    init();
  }
  window.addEventListener('load', function(){
    // re-init once after full load in case webfonts shifted layout metrics
    setTimeout(init, 60);
  });
})();
</script>
</body>
</html>
