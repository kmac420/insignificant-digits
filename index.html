<!doctype html>
<html lang="en">
<head>
<title>Insignificant Digits</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500;700;900&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #0b0c10;
    --bg-raised: #15171e;
    --ink: #f4f5f7;
    --ink-light: #9aa2b1;
    --hairline: rgba(255,255,255,0.09);
    --accent: #85a8d1;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a{ color: inherit; }

  /* ---------- sticky top bar (appears once the hero scrolls past) ---------- */

  .topbar{
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px clamp(16px, 4vw, 40px);
    background: rgba(11, 12, 16, 0.78);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--hairline);
    transform: translateY(-100%);
    transition: transform 0.25s ease;
  }

  .topbar.is-visible{ transform: translateY(0); }

  .topbar img{
    display: block;
    height: 18px;
    width: auto;
  }

  /* ---------- hero banner ---------- */

  .hero{
    position: relative;
    width: 100%;
    min-height: clamp(340px, 52vh, 600px);
    display: flex;
    align-items: flex-end;
    background-image: url('hero-bg.jpg');
    background-size: cover;
    background-position: 50% 45%;
    background-color: #1a1c22;
  }

  .hero::before{
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(8,9,12,0.18) 0%, rgba(8,9,12,0.3) 45%, var(--bg) 100%),
      rgba(8, 9, 12, 0.14);
  }

  .hero-content{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    padding: clamp(28px, 6vh, 56px) clamp(20px, 5vw, 56px) clamp(30px, 6vh, 56px);
    text-align: center;
  }

  .hero-eyebrow{
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(244, 245, 247, 0.78);
    margin: 0 0 1.1rem;
    text-shadow: 0 1px 10px rgba(0,0,0,0.35);
  }

  .hero-wordmark{
    margin: 0 0 0.9rem;
    line-height: 0;
  }

  .hero-wordmark img{
    display: inline-block;
    width: clamp(260px, 42vw, 600px);
    height: auto;
    filter: drop-shadow(0 8px 28px rgba(0,0,0,0.5));
  }

  .hero-tagline{
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(244, 245, 247, 0.72);
    margin: 0;
    text-shadow: 0 1px 10px rgba(0,0,0,0.35);
  }

  /* ---------- main content ---------- */

  main{
    position: relative;
    z-index: 1;
  }

  .content{
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(40px, 7vh, 72px) clamp(20px, 5vw, 32px) clamp(60px, 10vh, 96px);
  }

  .listen-label{
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin: 0 0 0.9rem;
  }

  .listen-title{
    font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: -0.005em;
    color: var(--ink);
    margin: 0 0 1.8rem;
    text-transform: lowercase;
  }

  .tracks{
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 5vh, 48px);
  }

  .player-frame{
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--hairline);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px rgba(0, 0, 0, 0.35);
    background: var(--bg-raised);
  }

  .player-frame iframe{
    display: block;
    width: 100%;
    border: 0;
  }

  .player-credit{
    font-size: 11px;
    color: var(--ink-light) !important;
    line-break: anywhere;
    word-break: normal;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: Interstate, 'Lucida Grande', 'Lucida Sans Unicode', 'Lucida Sans', Garuda, Verdana, Tahoma, sans-serif;
    font-weight: 400;
    padding: 8px 2px 0;
  }

  .player-credit a{
    color: var(--ink-light);
    text-decoration: none;
  }

  .player-credit a:hover,
  .player-credit a:focus-visible{
    text-decoration: underline;
  }

  .track-links{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 10px 2px 0;
  }

  .track-links-label{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-right: 2px;
  }

  .track-link-icon{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--brand, var(--ink-light));
    color: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .track-link-icon svg{
    width: 15px;
    height: 15px;
    fill: currentColor;
    display: block;
  }

  .track-link-icon:hover,
  .track-link-icon:focus-visible{
    transform: translateY(-1px) scale(1.07);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
  }

  .site-footer{
    margin: clamp(48px, 8vh, 72px) 0 0;
    text-align: center;
    border-top: 1px solid var(--hairline);
    padding-top: clamp(28px, 5vh, 40px);
  }

  .site-footer a{
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-light);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .site-footer a:hover,
  .site-footer a:focus-visible{
    color: var(--ink);
    border-bottom-color: var(--ink-light);
  }

  @media (max-width: 700px){
    .hero-wordmark img{
      width: clamp(240px, 70vw, 420px);
    }
  }
</style>
</head>
<body>
<div class="topbar" id="topbar" aria-hidden="true">
  <img src="insignificant-digits-white.png" alt="insignificant digits" />
</div>

<main>
  <div class="hero" id="hero">
    <div class="hero-content">
      <p class="hero-eyebrow">Artist</p>
      <h1 class="hero-wordmark"><img src="insignificant-digits-white.png" alt="insignificant digits" /></h1>
      <p class="hero-tagline">Toronto &middot; Electronic</p>
    </div>
  </div>

  <div class="content">
    <p class="listen-label">Now streaming</p>
    <h2 class="listen-title" id="listen-heading">latest track</h2>
    <div class="tracks" id="tracks"></div>

    <p class="site-footer"><a href="about.html">about</a></p>
  </div>
</main>

<script>
(function(){
  "use strict";

  // ---- SoundCloud tracks ----
  // To add another track, add one entry below with its `permalink` (the
  // track's normal soundcloud.com page -- copy it straight from the
  // browser's address bar) and a `title`. Every entry renders as its own
  // player automatically, in order -- no other markup needs to change.
  //
  // (The last entry also carries `embedUrl`, a SoundCloud-resolved form
  // of the same track kept from the original embed code. That field is
  // optional -- for a new track, `permalink` alone is enough.)
  //
  // To add streaming links (Apple Music, Spotify, YouTube Music) below a
  // track's player, add a `links` object with any of `appleMusic`,
  // `spotify`, `youtubeMusic` -- only the ones present are shown, in that
  // order. Omit `links` entirely for a track with no streaming links yet.
  var TRACKS = [
    {
      title: 'Sunny Side',
      permalink: 'https://soundcloud.com/insignificant-digits/sunny-side',
      links: {
        appleMusic: 'https://music.apple.com/ca/album/sunny-side/6820128998?i=6820129008',
        spotify: 'https://open.spotify.com/track/7owvqM8sZMrV9fNGR9nhHL?si=83ef9abcbabc4f85',
        youtubeMusic: 'https://music.youtube.com/watch?v=hzZL4ScVUx8&si=aq_wBKVy9ksOmUja'
      }
    },
    {
      title: 'Nine Volt',
      permalink: 'https://soundcloud.com/insignificant-digits/nine-volt'
    },
    {
      title: 'Introvert',
      permalink: 'https://soundcloud.com/insignificant-digits/introvert'
    },
    {
      title: 'something blew',
      permalink: 'https://soundcloud.com/insignificant-digits/something-blew',
      embedUrl: 'https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A2351493410'
    }
    // {
    //   title: 'another track',
    //   permalink: 'https://soundcloud.com/insignificant-digits/another-track'
    // }
  ];

  function escapeHtml(s){
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Official brand glyphs (path data) and brand colors, so each streaming
  // link renders as that service's own recognizable icon rather than a
  // plain text link. Source: the Simple Icons project (simpleicons.org),
  // which tracks each company's current official logo mark.
  var STREAM_LINK_ORDER = [
    {
      key: 'appleMusic',
      label: 'Apple Music',
      color: '#FA243C',
      icon: '<path d="M23.994 6.124a9.23 9.23 0 00-.24-2.19c-.317-1.31-1.062-2.31-2.18-3.043a5.022 5.022 0 00-1.877-.726 10.496 10.496 0 00-1.564-.15c-.04-.003-.083-.01-.124-.013H5.986c-.152.01-.303.017-.455.026-.747.043-1.49.123-2.193.4-1.336.53-2.3 1.452-2.865 2.78-.192.448-.292.925-.363 1.408-.056.392-.088.785-.1 1.18 0 .032-.007.062-.01.093v12.223c.01.14.017.283.027.424.05.815.154 1.624.497 2.373.65 1.42 1.738 2.353 3.234 2.801.42.127.856.187 1.293.228.555.053 1.11.06 1.667.06h11.03a12.5 12.5 0 001.57-.1c.822-.106 1.596-.35 2.295-.81a5.046 5.046 0 001.88-2.207c.186-.42.293-.87.37-1.324.113-.675.138-1.358.137-2.04-.002-3.8 0-7.595-.003-11.393zm-6.423 3.99v5.712c0 .417-.058.827-.244 1.206-.29.59-.76.962-1.388 1.14-.35.1-.706.157-1.07.173-.95.045-1.773-.6-1.943-1.536a1.88 1.88 0 011.038-2.022c.323-.16.67-.25 1.018-.324.378-.082.758-.153 1.134-.24.274-.063.457-.23.51-.516a.904.904 0 00.02-.193c0-1.815 0-3.63-.002-5.443a.725.725 0 00-.026-.185c-.04-.15-.15-.243-.304-.234-.16.01-.318.035-.475.066-.76.15-1.52.303-2.28.456l-2.325.47-1.374.278c-.016.003-.032.01-.048.013-.277.077-.377.203-.39.49-.002.042 0 .086 0 .13-.002 2.602 0 5.204-.003 7.805 0 .42-.047.836-.215 1.227-.278.64-.77 1.04-1.434 1.233-.35.1-.71.16-1.075.172-.96.036-1.755-.6-1.92-1.544-.14-.812.23-1.685 1.154-2.075.357-.15.73-.232 1.108-.31.287-.06.575-.116.86-.177.383-.083.583-.323.6-.714v-.15c0-2.96 0-5.922.002-8.882 0-.123.013-.25.042-.37.07-.285.273-.448.546-.518.255-.066.515-.112.774-.165.733-.15 1.466-.296 2.2-.444l2.27-.46c.67-.134 1.34-.27 2.01-.403.22-.043.442-.088.663-.106.31-.025.523.17.554.482.008.073.012.148.012.223.002 1.91.002 3.822 0 5.732z"/>'
    },
    {
      key: 'spotify',
      label: 'Spotify',
      color: '#1ED760',
      icon: '<path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>'
    },
    {
      key: 'youtubeMusic',
      label: 'YouTube Music',
      color: '#FF0000',
      icon: '<path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/>'
    }
  ];

  function renderTrackLinks(links){
    if (!links) return '';
    var parts = [];
    for (var i = 0; i < STREAM_LINK_ORDER.length; i++){
      var def = STREAM_LINK_ORDER[i];
      var url = links[def.key];
      if (url){
        parts.push(
          '<a class="track-link-icon" style="--brand:' + def.color + '" href="' + escapeHtml(url) + '" target="_blank" rel="noopener" aria-label="Listen on ' + def.label + '" title="' + def.label + '">' +
            '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">' + def.icon + '</svg>' +
          '</a>'
        );
      }
    }
    if (!parts.length) return '';
    return '<div class="track-links"><span class="track-links-label">Stream</span>' + parts.join('') + '</div>';
  }

  function renderTracks(){
    var container = document.getElementById('tracks');
    if (!container) return;
    var headingEl = document.getElementById('listen-heading');
    if (headingEl){ headingEl.textContent = TRACKS.length > 1 ? 'tracks' : 'latest track'; }
    var html = '';
    for (var i = 0; i < TRACKS.length; i++){
      var track = TRACKS[i];
      var safeTitle = escapeHtml(track.title);
      var safePermalink = escapeHtml(track.permalink);
      var embedSrc = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(track.embedUrl || track.permalink) +
        '&color=%2385a8d1&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true';
      html += '<div class="track">' +
          '<div class="player-frame">' +
            '<iframe title="Insignificant Digits - ' + safeTitle + ', SoundCloud player" width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="' + embedSrc + '"></iframe>' +
          '</div>' +
          '<div class="player-credit">' +
            '<a href="https://soundcloud.com/insignificant-digits" title="insignificant digits" target="_blank" rel="noopener">insignificant digits</a> &middot; ' +
            '<a href="' + safePermalink + '" title="' + safeTitle + '" target="_blank" rel="noopener">' + safeTitle + '</a>' +
          '</div>' +
          renderTrackLinks(track.links) +
        '</div>';
    }
    container.innerHTML = html;
  }

  renderTracks();
})();
</script>

<script>
(function(){
  "use strict";

  // Slim top bar that fades in once the hero banner has scrolled mostly
  // out of view, echoing the "sticky artist name" header seen on Apple
  // Music / Spotify artist pages.
  var topbar = document.getElementById('topbar');
  var hero = document.getElementById('hero');
  if (!topbar || !hero) return;

  var ticking = false;

  function update(){
    ticking = false;
    var threshold = Math.max(120, hero.offsetHeight - 120);
    var show = window.scrollY > threshold;
    topbar.classList.toggle('is-visible', show);
  }

  window.addEventListener('scroll', function(){
    if (!ticking){
      ticking = true;
      requestAnimationFrame(update);
    }
  }, { passive: true });

  window.addEventListener('resize', update);
  update();
})();
</script>
</body>
</html>
