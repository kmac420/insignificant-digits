  .bg::after{
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(8, 9, 12, 0.46);
  }

  /* Holds open most of a viewport of clear background so the photo reads on
     its own first -- but a little short of the full 100vh, so the listen
     card's rounded top edge peeks up into view from the start as a hint
     that there's more to scroll to. */
  .bg-spacer{
    height: calc(100vh - clamp(36px, 8vh, 84px));
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    pointer-events: none;
  }

  .hero-intro{
    text-align: center;
    padding: 0 clamp(20px, 5vw, 56px);
  }

  .hero-eyebrow{
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(244, 245, 247, 0.78);
    margin: 0 0 1.1rem;
    text-shadow: 0 1px 10px rgba(0,0,0,0.4);
  }

  .hero-wordmark{
    margin: 0 0 0.9rem;
    line-height: 0;
  }

  .hero-wordmark img{
    display: inline-block;
    width: clamp(150px, 19vw, 260px);
    height: auto;
    filter: drop-shadow(0 8px 28px rgba(0,0,0,0.55));
  }

  .hero-tagline{
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(244, 245, 247, 0.72);
    margin: 0;
    text-shadow: 0 1px 10px rgba(0,0,0,0.4);
  }

  /* ---------- sticky top bar (appears once the intro has scrolled past) ---------- */

  .topbar{
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px clamp(16px, 4vw, 40px);
    background: rgba(11, 12, 16, 0.7);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--hairline);
    transform: translateY(-100%);
    transition: transform 0.25s ease;
  }

  .topbar.is-visible{ transform: translateY(0); }

  .topbar img{
    display: block;
    height: 34px;
    width: auto;
  }

  /* ---------- listen section ---------- */
  /* A floating glass card that rises up over the fixed background photo as
     the page scrolls, with margin on every side so the image stays visible
     around it instead of being completely covered. */

  main{
    position: relative;
    z-index: 1;
  }

  .listen{
    position: relative;
    width: calc(100% - 2 * clamp(12px, 4vw, 48px));
    max-width: 760px;
    margin: 0 auto clamp(28px, 7vh, 72px);
    background: var(--card);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    padding: clamp(32px, 6vh, 64px) clamp(20px, 5vw, 48px);
  }

  .listen-inner{
    max-width: 680px;
    margin: 0 auto;
  }

  .listen-label{
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin: 0 0 0.9rem;
  }

  .listen-title{
    font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: -0.005em;
    color: var(--ink);
    margin: 0 0 1.6rem;
    text-transform: lowercase;
  }

  .tracks{
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 5vh, 48px);
  }

  .player-frame{
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--hairline);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px rgba(0, 0, 0, 0.35);
    background: rgba(0,0,0,0.25);
  }

  .player-frame iframe{
    display: block;
    width: 100%;
    border: 0;
  }

  .player-credit{
    font-size: 11px;
    color: var(--ink-light) !important;
    line-break: anywhere;
    word-break: normal;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: Interstate, 'Lucida Grande', 'Lucida Sans Unicode', 'Lucida Sans', Garuda, Verdana, Tahoma, sans-serif;
    font-weight: 400;
    padding: 8px 2px 0;
  }

  .player-credit a{
    color: var(--ink-light);
    text-decoration: none;
  }

  .player-credit a:hover,
  .player-credit a:focus-visible{
    text-decoration: underline;
  }

  .track-links{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 10px 2px 0;
  }

  .track-links-label{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-right: 2px;
  }

  .track-link-icon{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--brand, var(--ink-light));
    color: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .track-link-icon svg{
    width: 15px;
    height: 15px;
    fill: currentColor;
    display: block;
  }

  .track-link-icon:hover,
  .track-link-icon:focus-visible{
    transform: translateY(-1px) scale(1.07);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
  }

  .site-footer{
    margin: clamp(32px, 6vh, 56px) 0 0;
    text-align: center;
  }

  .site-footer a{
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-light);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .site-footer a:hover,
  .site-footer a:focus-visible{
    color: var(--ink);
    border-bottom-color: var(--ink-light);
  }

  @media (max-width: 700px){
    .hero-wordmark img{
      width: clamp(140px, 36vw, 220px);
    }
  }
</style>
</head>

  function renderTrackLinks(links){
    if (!links) return '';
    var parts = [];
    for (var i = 0; i < STREAM_LINK_ORDER.length; i++){
      var def = STREAM_LINK_ORDER[i];
      var url = links[def.key];
      if (url){
        parts.push(
          '<a class="track-link-icon" style="--brand:' + def.color + '" href="' + escapeHtml(url) + '" target="_blank" rel="noopener" aria-label="Listen on ' + def.label + '" title="' + def.label + '">' +
            '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">' + def.icon + '</svg>' +
          '</a>'
        );
      }
    }
    if (!parts.length) return '';
    return '<div class="track-links"><span class="track-links-label">Stream</span>' + parts.join('') + '</div>';
  }

  function renderTracks(){
    var container = document.getElementById('tracks');
    if (!container) return;
    var headingEl = document.getElementById('listen-heading');
    if (headingEl){ headingEl.textContent = TRACKS.length > 1 ? 'tracks' : 'latest track'; }
    var html = '';
    for (var i = 0; i < TRACKS.length; i++){
      var track = TRACKS[i];
      var safeTitle = escapeHtml(track.title);
      var safePermalink = escapeHtml(track.permalink);
      var embedSrc = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(track.embedUrl || track.permalink) +
        '&color=%2385a8d1&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true';
      html += '<div class="track">' +
          '<div class="player-frame">' +
            '<iframe title="Insignificant Digits - ' + safeTitle + ', SoundCloud player" width="100%" height="300" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="' + embedSrc + '"></iframe>' +
          '</div>' +
          '<div class="player-credit">' +
            '<a href="https://soundcloud.com/insignificant-digits" title="insignificant digits" target="_blank" rel="noopener">insignificant digits</a> &middot; ' +
            '<a href="' + safePermalink + '" title="' + safeTitle + '" target="_blank" rel="noopener">' + safeTitle + '</a>' +
          '</div>' +
          renderTrackLinks(track.links) +
        '</div>';
    }
    container.innerHTML = html;
  }

  renderTracks();
})();
</script>

<script>
(function(){
  "use strict";

  // Slim top bar that fades in once the hero intro has scrolled mostly
  // out of view, echoing the "sticky artist name" header seen on Apple
  // Music / Spotify artist pages.
  var topbar = document.getElementById('topbar');
  var spacer = document.getElementById('bgSpacer');
  if (!topbar || !spacer) return;

  var ticking = false;

  function update(){
    ticking = false;
    var threshold = Math.max(120, spacer.offsetHeight - 120);
    var show = window.scrollY > threshold;
    topbar.classList.toggle('is-visible', show);
  }

  window.addEventListener('scroll', function(){
    if (!ticking){
      ticking = true;
      requestAnimationFrame(update);
    }
  }, { passive: true });

  window.addEventListener('resize', update);
  update();
})();
</script>
